<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 680 148" width="100%" height="100%">
  <defs>
    <!-- Gradients for the 3D 'D' shape -->
    <linearGradient id="footerBlueFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="35%" stop-color="#0084FF" />
      <stop offset="70%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#051C66" />
    </linearGradient>
    
    <linearGradient id="footerBlueBack" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#002D9C" />
    </linearGradient>

    <linearGradient id="footerRoad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="footerOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 8)" filter="url(#subtleGlow)">
    <!-- Orange Speed Motion Trails on the left -->
    <g fill="url(#footerOrange)">
      <rect x="0" y="44" width="45" height="7.5" rx="3.75" />
      <rect x="0" y="60" width="56" height="8" rx="4" />
      <rect x="15" y="77" width="38" height="7.5" rx="3.75" />
    </g>

    <!-- The 3D D-Shape -->
    <path d="M 52,14 L 105,14 C 158,14 188,48 188,80 C 188,112 158,146 105,146 L 52,146 Z" 
          fill="url(#footerBlueFront)" />

    <!-- Inner hollow / perspective road -->
    <path d="M 52,146 C 78,146 100,135 116,112 C 128,95 132,70 126,52 C 124,46 120,40 114,35 C 105,28 92,26 78,26 L 52,26 Z" 
          fill="url(#footerBlueBack)" opacity="0.45" />

    <!-- Stylized highway road emerging with perspective -->
    <path d="M 54,146 C 75,138 96,118 112,94 C 124,76 130,58 131,44 C 126,44 116,50 108,62 C 96,80 82,108 54,146 Z" 
          fill="url(#footerRoad)" />

    <!-- Orange road divider dashed stripes -->
    <g fill="#FF5E00">
      <polygon points="121,49 123,49 122,54 120,54" />
      <polygon points="117,60 120,60 117,67 114,67" />
      <polygon points="111,73 115,73 111,83 107,83" />
      <polygon points="102,91 107,91 100,104 95,104" />
      <polygon points="88,114 94,114 84,132 78,132" />
    </g>

    <!-- White sports car silhouette driving along the top curve -->
    <path d="M 124,38 C 130,34 140,30 152,31 C 160,32 166,35 174,40 C 177,42 178,44 176,46 C 173,47 167,46 163,44 C 154,40 144,38 135,41 C 129,43 125,45 122,44 C 121,43 122,39 124,38 Z" 
          fill="#FFFFFF" />
    <!-- Car windshield and rear contour -->
    <path d="M 134,38 C 140,34 148,32 155,33 C 158,34 163,37 167,40 L 157,40 C 151,37 144,36 138,37 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- BRAND TYPOGRAPHY FOR DARK BACKGROUND (NOT WHITE SILHOUETTE, REAL BRAND COLORS) -->
  <g transform="translate(208, 0)">
    <!-- DANALB in White -->
    <text x="0" y="86" font-family="'Plus Jakarta Sans', 'DM Sans', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-0.5">DANALB</text>
    
    <!-- EXPRESS in Brand Orange -->
    <text x="216" y="86" font-family="'Plus Jakarta Sans', 'DM Sans', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FF5E00" letter-spacing="-0.5">EXPRESS</text>

    <!-- SUBTITLE: SERVIÇOS DE TÁXI in Light Slate -->
    <g transform="translate(0, 116)">
      <line x1="2" y1="-6" x2="62" y2="-6" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
      <text x="74" y="0" font-family="'Plus Jakarta Sans', 'DM Sans', sans-serif" font-weight="700" font-size="18.5" fill="#E2E8F0" letter-spacing="9">SERVIÇOS DE TÁXI</text>
      <line x1="406" y1="-6" x2="466" y2="-6" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>